[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "uibench-core"
version = "0.1.0"
description = "UIBench core analysis engine"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "click>=8.1.0",
]

[project.optional-dependencies]
fullstack = [
    "playwright>=1.42.0",
    "axe-playwright-python>=0.1.4",
    "reportlab>=4.4.0",
    "spacy>=3.7.0",
]
cli = [
    "playwright>=1.42.0",
    "reportlab>=4.4.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.13.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "core/tests"]
addopts = "-v --tb=short"

[tool.mypy]
strict = true
pretty = true
show_error_codes = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
