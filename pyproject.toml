[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "uibench"
version = "0.1.0"
description = "Web Interface Analysis & Design System Platform"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["backend/tests", "core/tests"]
addopts = "-v --tb=short"

[tool.mypy]
strict = true
pretty = true
show_error_codes = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
